[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "raft-mvcc-kv-store"
version = "0.1.0"
description = "Distributed Fault-Tolerant Key-Value Storage Engine Using Raft Consensus & MVCC"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
